<style>
:root{
  --paper:#F7F2E7; --card:#FFFFFF; --ink:#1E2A25; --ink-soft:#5A675F;
  --line:#E7DFCE; --line-2:#F0EADA;
  --gold:#E0A32B; --gold-deep:#B9821A; --gold-soft:#FBF0D6;
  --green:#2F7D57; --green-soft:#E7F1EA;
  --red:#B23A2E; --red-soft:#F7E7E3;
  --pine:#153029; --pine-2:#1D4137; --teal:#14544B;
  --shadow:0 1px 2px rgba(30,42,37,.06),0 8px 24px rgba(30,42,37,.06);
  --radius:16px; --radius-sm:11px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{direction:rtl}
body{
  font-family:"IBM Plex Sans Arabic","Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  background:var(--paper); color:var(--ink); -webkit-text-size-adjust:100%;
  min-height:100vh;
}
h1,h2,h3,.brand{font-family:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.hide{display:none !important}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--pine);color:#F4EFE0;
  display:flex;align-items:center;gap:12px;padding:12px 16px;box-shadow:0 6px 18px rgba(21,48,41,.18);
}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(224,163,43,.22)}
.brand small{font-family:"IBM Plex Sans Arabic";font-weight:500;font-size:12px;color:#B9C7BE;letter-spacing:0}
.topbar .who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#CBD6CE}
.topbar .who b{color:#fff;font-weight:600}
.btn-ghost{background:rgba(255,255,255,.10);color:#F4EFE0;border:1px solid rgba(255,255,255,.16);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:500}
.btn-ghost:hover{background:rgba(255,255,255,.18)}

/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 120px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:14px 16px 4px;max-width:1080px;margin:0 auto;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--ink-soft);
  padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600}
.tab.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.tab .badge{display:inline-block;min-width:18px;text-align:center;background:var(--gold);color:#3a2b06;border-radius:999px;font-size:11px;padding:1px 6px;margin-inline-start:6px;font-weight:700}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:16px}
.section-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;margin:0 0 12px}
.section-title .k{width:6px;height:18px;border-radius:3px;background:var(--gold)}
.muted{color:var(--ink-soft)}
.grid{display:grid;gap:14px}
@media(min-width:820px){.grid.cols2{grid-template-columns:1fr 1fr}.grid.side{grid-template-columns:1.35fr .9fr;align-items:start}}

/* ---------- Buttons / inputs ---------- */
.btn{background:var(--gold);color:#3a2b06;border:none;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--gold-deep)}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.block{width:100%}
.btn.dark{background:var(--pine);color:#fff;box-shadow:0 2px 0 #0c1d17}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px;box-shadow:none}
.btn.danger{background:var(--red-soft);color:var(--red);box-shadow:none;font-weight:700}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
.input,select.input,textarea.input{

.input:focus{border-color:var(--gold)}
textarea.input{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Chips (people) ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.chip.add{border-style:dashed;color:var(--gold-deep);border-color:var(--gold)}

/* ---------- Menu grid ---------- */
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.mcard{position:relative;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 13px 12px;display:flex;flex-direction:column;gap:8px;min-height:92px;transition:border-color .12s,transform .05s}
.mcard:hover{border-color:var(--gold)}
.mcard:active{transform:scale(.98)}

.mcard .no{position:absolute;inset-inline-end:9px;top:9px;font-size:11px;color:var(--ink-soft);background:var(--line-2);border-radius:7px;padding:1px 7px;font-weight:600}
.mcard .qbadge{position:absolute;inset-inline-start:9px;top:9px;background:var(--green);color:#fff;font-weight:800;font-size:12px;min-width:22px;text-align:center;border-radius:8px;padding:2px 6px}

/* ---------- Draft / order list ---------- */
.dline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}

.empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:26px 10px}

/* sticky total bar (order screen) */
.totalbar{position:fixed;inset-inline:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);

.totalbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px}
.totalbar .tt{font-size:13px;color:var(--ink-soft);font-weight:600}
.totalbar .amt{font-size:22px;font-weight:800;font-family:"Cairo"}
.totalbar .btn{margin-inline-start:auto}

/* ---------- People/balance list ---------- */
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.prow .av{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.prow .nm{font-weight:700;font-size:15px}
.prow .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.prow .bal{margin-inline-start:auto;text-align:end}
.prow .bal .v{font-weight:800;font-size:17px;font-family:"Cairo"}
.owed{color:var(--red)} .clear{color:var(--green)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.owed{background:var(--red-soft)} .pill.clear{background:var(--green-soft);color:var(--green)}

/* daily digest */
.digest-person{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:10px}
.digest-person h4{margin:0 0 6px;font-size:14px;font-family:"Cairo"}
.digest-person .it{font-size:13px;color:var(--ink-soft)}
.sumbox{background:var(--pine);color:#EAF1EC;border-radius:14px;padding:16px}
.sumbox h3{margin:0 0 10px;color:#fff;font-size:16px;display:flex;align-items:center;gap:8px}
.sumbox .agg{display:flex;flex-wrap:wrap;gap:8px}
.sumbox .agg span{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);padding:6px 11px;border-radius:10px;font-size:14px;font-weight:600}
.sumbox textarea{width:100%;margin-top:12px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:11px;font-size:13px;min-height:96px;line-height:1.7}
.datenav{display:flex;align-items:center;gap:8px}
.datenav input{max-width:180px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:11px 10px;text-align:start;border-bottom:1px solid var(--line-2)}
.tbl th{font-size:12px;color:var(--ink-soft);font-weight:700;background:var(--paper)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num,.tbl th.num{text-align:end;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line);background:var(--line-2)}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.login-card{width:100%;max-width:420px}
.login-hero{background:var(--pine);color:#fff;border-radius:20px 20px 0 0;padding:26px 24px;text-align:center}
.login-hero .b{font-family:"Cairo";font-weight:800;font-size:30px;letter-spacing:1px}
.login-hero .s{color:#B9C7BE;font-size:13px;margin-top:4px}
.login-body{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 20px 20px;padding:22px}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.pinput{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(21,32,27,.5);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}

@media(min-width:640px){.modal{border-radius:18px}}

.modal-h .x{margin-inline-start:auto;background:var(--line-2);border:none;width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--ink-soft)}
.modal-b{padding:18px}
.stack{display:grid;gap:14px}

/* toast */
.toast{position:fixed;bottom:88px;inset-inline:0;display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast .t{background:var(--pine);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s}
.toast .t.show{opacity:1;transform:none}

/* receipt (print statement) */
#printRoot{display:none}
.receipt{background:#fff;color:#111;max-width:520px;margin:0 auto;padding:26px 26px 34px;position:relative;font-family:"IBM Plex Sans Arabic"}
.receipt .r-head{text-align:center;border-bottom:2px dashed #bbb;padding-bottom:14px;margin-bottom:14px}
.receipt .r-b{font-family:"Cairo";font-weight:800;font-size:26px}
.receipt .r-meta{font-size:13px;color:#555;margin-top:4px}
.receipt table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.receipt th,.receipt td{padding:7px 4px;border-bottom:1px solid #eee;text-align:start}
.receipt td.num,.receipt th.num{text-align:end;font-variant-numeric:tabular-nums}
.receipt .r-tot{border-top:2px dashed #bbb;margin-top:14px;padding-top:12px}
.receipt .r-tot .line{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.receipt .r-tot .big{font-size:20px;font-weight:800;font-family:"Cairo"}
.receipt .r-foot{text-align:center;color:#888;font-size:12px;margin-top:20px;border-top:2px dashed #bbb;padding-top:12px}

/* ---------- المالية / الأصناف / السجل ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--ink-soft);font-weight:600}
.kpi .v{font-size:20px;font-weight:800;font-family:"Cairo";margin-top:4px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.lrow:last-child{border-bottom:none}
.lmain{flex:1;min-width:0}
.lt1{font-size:14px;font-weight:600;line-height:1.7}
.lt2{font-size:12px;color:var(--ink-soft);margin-top:2px}
.lnum{text-align:end;flex:none}
.lact{flex:none}
.ktag{display:inline-block;font-size:11px;font-weight:700;border-radius:7px;padding:1px 8px;margin-inline-end:8px;background:var(--line-2);color:var(--ink-soft)}
.ktag.k-order{background:var(--gold-soft);color:var(--gold-deep)}
.ktag.k-pay{background:var(--green-soft);color:var(--green)}
.ktag.k-adj{background:#E8EEF8;color:#2D4E86}
.banner{background:var(--gold-soft);border:1px solid var(--gold);color:#5a4210;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:14px;line-height:1.8}
.infoline{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink-soft)}
.back{background:transparent;border:none;color:var(--ink-soft);font-weight:700;font-size:14px;padding:4px 0 12px}
.cattabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:56px;z-index:20;background:var(--paper);-webkit-overflow-scrolling:touch}
.cat{white-space:nowrap;background:#fff;border:1.5px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;flex:none}
.cat.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.cat .cb{display:inline-block;min-width:18px;text-align:center;background:var(--green);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-inline-start:6px}
.cathead{font-family:"Cairo";font-weight:800;font-size:15px;color:var(--pine);margin:6px 0 10px}

<script>
"use strict";

/* ============================================================
   إعداد Supabase — بدّل القيمتين بقيمك من لوحة Supabase
   (Project Settings > API):  Project URL  و  anon public key
============================================================ */
const SUPABASE_URL = "https://brpnsactkyxunhaizyak.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_--iEtNX51RxJ1jH7D0RkBg_gVKooTnm";

let sb=null;
function sbReady(){ return sb && !SUPABASE_URL.startsWith("ضع_") && !SUPABASE_ANON_KEY.startsWith("ضع_"); }

/* ---- تحويل بين شكل قاعدة البيانات وشكل التطبيق ---- */
function tsOf(r){ return Date.parse(r.created_at)||0; }
function orderFromDb(r){ return {id:r.id,personId:r.person_id,date:r.date,items:r.items||[],
  manual:r.manual||0,manualNote:r.manual_note||"",note:r.note||"",total:r.total||0,ts:tsOf(r)}; }
function orderToDb(o){ return {id:o.id,person_id:o.personId,date:o.date,items:o.items||[],
  manual:o.manual||0,manual_note:o.manualNote||"",note:o.note||"",total:o.total||0}; }
function payFromDb(r){ return {id:r.id,personId:r.person_id,amount:r.amount||0,date:r.date,note:r.note||"",ts:tsOf(r)}; }
function personToDb(p){ const o={id:p.id,name:p.name,pin:p.pin||""}; if(DB&&DB.schemaOk) o.opening_balance=p.opening||0; return o; }
function menuToDb(m){ const o={id:m.id,num:m.num,name:m.name,price:m.price}; if(DB&&DB.schemaOk) o.category=m.category||""; return o; }

/* قراءة جدول كامل على دفعات — Supabase يرجّع بحد أقصى 1000 صف بالطلب الواحد،
   وبدون هذا التقسيم تطلع الأرصدة ناقصة بصمت لمّا تكبر البيانات */
async function fetchAll(table){
  const out=[]; const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await sb.from(table).select('*').order('id').range(from,from+step-1);
    if(error) return {data:null,error};
    out.push(...data);
    if(data.length<step) break;
  }
  return {data:out,error:null};
}

/* أمر ترقية قاعدة البيانات (نفس ملف supabase_upgrade.sql) */
const UPGRADE_SQL = `-- =========================================================
--  سفرة — ترقية قاعدة البيانات (الإدارة المالية + أصناف المنيو)
--  الصق هذا كامل في: Supabase > SQL Editor > New query > Run
--  آمن للتشغيل أكثر من مرة، ولا يمسح أي بيانات موجودة.
-- =========================================================

-- 1) رصيد سابق لكل شخص (موجب = عليه، سالب = له)
alter table people add column if not exists opening_balance int default 0;

-- 2) صنف الوجبة (لتبويبات المنيو)
alter table menu add column if not exists category text default '';

-- 3) تسويات الحساب: خصم أو إضافة (المبلغ موجب = يزيد عليه، سالب = خصم)
create table if not exists adjustments (
  id text primary key,
  person_id text references people(id) on delete cascade,
  amount int not null,
  date date not null,
  note text default '',
  created_at timestamptz default now()
);

-- 4) سجل التغييرات (من عدّل أو حذف ماذا ومتى)
create table if not exists audit_log (
  id text primary key,
  ts timestamptz default now(),
  actor text default 'admin',
  action text,
  person_id text,
  details text default ''
);

-- 5) الحماية + السماح للتطبيق بالقراءة والكتابة
alter table adjustments enable row level security;
alter table audit_log   enable row level security;
drop policy if exists app_adjustments on adjustments;
drop policy if exists app_audit       on audit_log;
create policy app_adjustments on adjustments for all using (true) with check (true);
create policy app_audit       on audit_log   for all using (true) with check (true);

-- 6) تصنيف مبدئي للوجبات (تقدر تغيّره من تبويب المنيو بعدين)
update menu set category='لحوم'            where id in ('m1','m2','m3','m5','m9')              and coalesce(category,'')='';
update menu set category='أطباق على التمن' where id in ('m4','m6','m10','m11','m18','m20')     and coalesce(category,'')='';
update menu set category='دجاج'            where id in ('m12','m16','m17')                      and coalesce(category,'')='';
update menu set category='إضافات'          where id in ('m7','m8','m13','m19')                  and coalesce(category,'')='';
update menu set category='مشروبات'         where id in ('m14','m15')                            and coalesce(category,'')='';

-- تم ✓
`;

/* ---- تحميل كل البيانات ---- */
async function loadAll(){
  const [pe,me,or,pa,se,ad,au]=await Promise.all([
    sb.from('people').select('*'),
    sb.from('menu').select('*'),
    fetchAll('orders'),
    fetchAll('payments'),
    sb.from('settings').select('*').eq('id',1).maybeSingle(),
    fetchAll('adjustments'),
    sb.from('audit_log').select('*').order('ts',{ascending:false}).limit(300)
  ]);

/* قراءة رقم من حقل: يقبل الأرقام العربية والفارسية والفواصل (٥٠٠٠ أو 5,000) */
function toInt(v){
  v=String(v==null?"":v)
    .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[,٬،\s]/g,"").replace(/[−–]/g,"-");
  const n=parseInt(v,10); return isNaN(n)?0:n;
}

function fmtTime(ts){ const d=new Date(ts), p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function monthRange(offset){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+offset);
  const y=d.getFullYear(), m=d.getMonth(), p=x=>String(x).padStart(2,"0"), last=new Date(y,m+1,0).getDate();
  return [y+"-"+p(m+1)+"-01", y+"-"+p(m+1)+"-"+p(last)]; }
function monthStartStr(){ return todayStr().slice(0,8)+"01"; }

/* ============ دفتر الحساب (الأساس لكل الأرصدة) ============
   كل حركة لها مبلغ بإشارة:  موجب = يزيد عليه  |  سالب = ينقص عنه
   رصيد سابق (+) · طلب (+) · إضافة (+) · خصم (−) · دفعة (−)
   الرصيد = مجموع كل الحركات.  موجب = عليه، سالب = له (دفع زيادة). */
const KIND_RANK={open:0,order:1,adj:2,pay:3};
function ledgerEntries(id){
  const p=person(id), out=[];
  if(p && p.opening) out.push({kind:"open",id:"open",date:"0000-00-00",amount:p.opening,ts:0});
  DB.orders.filter(o=>o.personId===id).forEach(o=>out.push({kind:"order",id:o.id,date:o.date,amount:orderTotal(o),ref:o,ts:o.ts||0}));
  (DB.adjustments||[]).filter(a=>a.personId===id).forEach(a=>out.push({kind:"adj",id:a.id,date:a.date,amount:a.amount,ref:a,ts:a.ts||0}));
  DB.payments.filter(x=>x.personId===id).forEach(x=>out.push({kind:"pay",id:x.id,date:x.date,amount:-x.amount,ref:x,ts:x.ts||0}));
  out.sort((a,b)=>a.date.localeCompare(b.date)||KIND_RANK[a.kind]-KIND_RANK[b.kind]||a.ts-b.ts);
  return out;
}
/* الرصيد (كل الأيام، أو حتى تاريخ معيّن) */
function balance(id,upTo){
  return ledgerEntries(id).filter(e=>!upTo||e.date<=upTo).reduce((s,e)=>s+e.amount,0);
}
/* كشف فترة: رصيد سابق ← حركات الفترة (برصيد متراكم) ← رصيد ختامي */
function statement(id,from,to){
  const all=ledgerEntries(id);
  const inr=all.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));
  const prev=(from?all.filter(e=>e.date<from):[]).reduce((s,e)=>s+e.amount,0)
            +inr.filter(e=>e.kind==="open").reduce((s,e)=>s+e.amount,0);
  let run=prev;
  const entries=inr.filter(e=>e.kind!=="open").map(e=>{ run+=e.amount; return {...e,run}; });
  const sum=k=>entries.filter(e=>e.kind===k).reduce((s,e)=>s+e.amount,0);
  return {prev,entries,orders:sum("order"),adj:sum("adj"),pay:-sum("pay"),closing:run};
}
function entryLabel(e){
  if(e.kind==="open") return "رصيد سابق (قبل استخدام النظام)";
  if(e.kind==="prev") return esc(e.label||"رصيد سابق");
  if(e.kind==="order"){ const o=e.ref;
    const items=(o.items||[]).map(i=>esc(i.name)+(i.qty>1?" ×"+i.qty:"")).join("، ");
    const man=o.manual?(items?" + ":"")+"مبلغ يدوي"+(o.manualNote?" ("+esc(o.manualNote)+")":""):"";
    return (items+man)||"طلب"; }
  if(e.kind==="pay") return "دفعة"+(e.ref.note?" — "+esc(e.ref.note):"");
  if(e.kind==="adj") return (e.ref.amount<0?"خصم":"إضافة")+(e.ref.note?" — "+esc(e.ref.note):"");
  return "";
}
function ledgerRows(entries,admin){
  return entries.map(e=>{
    const tag={open:"سابق",prev:"سابق",order:"طلب",pay:"دفعة",adj:(e.amount<0?"خصم":"إضافة")}[e.kind];
    const editable=admin && e.kind!=="prev";
    return `<div class="lrow">
      <div class="lmain"><div class="lt1"><span class="ktag k-${e.kind==="prev"?"open":e.kind}">${tag}</span>${entryLabel(e)}</div>
        <div class="lt2">${e.date&&e.date!=="0000-00-00"?dispDate(e.date):""}</div></div>
      <div class="lnum"><div class="num ${e.amount<0?"clear":""}" style="font-weight:800">${e.amount<0?"−":"+"}${fmt(Math.abs(e.amount))}</div>
        <div class="lt2 num">الرصيد <span class="${e.run>0?"owed":"clear"}">${fmt(e.run)}</span></div></div>
      ${editable?`<div class="lact"><button class="btn line sm" data-ledit="${e.kind}:${e.id}">تعديل</button></div>`:""}
    </div>`;
  }).join("");
}
function summaryCells(st){
  const c=(l,v,cls)=>`<div class="kpi"><div class="l">${l}</div><div class="v num ${cls||""}">${fmt(v)}</div></div>`;
  return `<div class="kpis">${c("رصيد سابق",st.prev)}${c("طلبات الفترة",st.orders)}${st.adj?c("تسويات (خصم/إضافة)",st.adj):""}${c("مدفوع",st.pay,"clear")}${c("الرصيد الختامي",st.closing,st.closing>0?"owed":"clear")}</div>`;
}

/* ============ القفل ============
   الطلب يُقفل عن الموظف إذا: قفلته الإدارة يدويًا، أو صار يومه ماضي، أو عدّى وقت القفل التلقائي (اختياري) */
function cutoffTime(){ return (DB.locks&&DB.locks._cutoff)||""; }
function isLocked(date){
  if(DB.locks && DB.locks[date]===true) return true;
  const today=todayStr();
  if(date<today) return true;
  const c=cutoffTime();
  if(c && date===today){ const n=new Date(), t=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); if(t>=c) return true; }
  return false;
}
function lockReason(date){
  if(DB.locks && DB.locks[date]===true) return "الإدارة قفلت طلبات هذا اليوم";
  if(date<todayStr()) return "هذا الطلب من يوم سابق";
  return "انتهى وقت الطلب لهذا اليوم";
}

function bindMyOrders(){
  document.querySelectorAll("[data-myedit]").forEach(b=>b.onclick=()=>customerEditOrder(b.dataset.myedit));
  document.querySelectorAll("[data-mydel]").forEach(b=>b.onclick=()=>customerDeleteOrder(b.dataset.mydel));
}
async function refreshOrder(oid){
  try{
    const {data,error}=await sb.from('orders').select('*').eq('id',oid).maybeSingle();
    if(error) return null;
    const i=DB.orders.findIndex(x=>x.id===oid);
    if(!data){ if(i>=0) DB.orders.splice(i,1); return null; }
    const o=orderFromDb(data); if(i>=0) DB.orders[i]=o; else DB.orders.push(o); return o;
  }catch(e){ return null; }
}
async function customerEditOrder(oid){
  await refreshLocks();
  const o=await refreshOrder(oid);
  if(!o||o.personId!==S.personId){ toast("الطلب غير موجود (ربما حذفته الإدارة)"); renderView(); return; }
  if(isLocked(o.date)){ toast("ما تقدر تعدّل — "+lockReason(o.date)); renderView(); return; }
  orderEditModal(oid,true);
}
async function customerDeleteOrder(oid){
  await refreshLocks();
  const o=await refreshOrder(oid);
  if(!o||o.personId!==S.personId){ toast("الطلب غير موجود"); renderView(); return; }
  if(isLocked(o.date)){ toast("ما تقدر تحذف — "+lockReason(o.date)); renderView(); return; }
  confirmDo("حذف طلبك؟",async()=>{
    await refreshLocks();
    if(isLocked(o.date)){ toast("ما تقدر تحذف — "+lockReason(o.date)); renderView(); return; }
    const ok=await run(()=>apiDeleteOrder(oid),"تم حذف الطلب"); if(!ok)return;
    DB.orders=DB.orders.filter(x=>x.id!==oid);
    audit("حذف طلب (من الموظف)",o.personId,`${pname(o.personId)} · ${dispDate(o.date)} · ${fmt(orderTotal(o))}`,pname(o.personId));
    renderView();
  });
}

/* فلترة المنيو: الصنف المختار + البحث (البحث يشمل كل الأصناف) */
function applyMenuFilter(){
  const q=(el("menuSearch").value||"").trim();
  const cat=q?"*":(S.cat||"*");
  document.querySelectorAll("#menuSecs .catsec").forEach(sec=>{
    let any=false;
    sec.querySelectorAll(".mcard").forEach(c=>{ const show=!q||c.dataset.nm.includes(q); c.classList.toggle("hide",!show); if(show)any=true; });
    sec.classList.toggle("hide",!((cat==="*"||cat===sec.dataset.sec)&&any));
  });
  document.querySelectorAll("#catTabs .cat").forEach(b=>b.classList.toggle("on",b.dataset.cat===(q?"*":(S.cat||"*"))));
}

function draftEntries(){ return Object.values(S.draft).filter(d=>d.qty>0); }
function draftItemsTotal(){ return draftEntries().reduce((s,d)=>s+d.price*d.qty,0); }
function addDraft(mid){ const m=DB.menu.find(x=>x.id===mid); if(!m)return;
  if(!S.draft[mid]) S.draft[mid]={id:mid,name:m.name,price:m.price,qty:0};
  S.draft[mid].qty++; updateDraftPanel(); }
function setQty(mid,q){ if(!S.draft[mid])return; S.draft[mid].qty=Math.max(0,q);
  if(S.draft[mid].qty===0) delete S.draft[mid]; updateDraftPanel(); }

function updateDraftPanel(){
  const host=el("draftItems"); if(!host)return;
  const ents=draftEntries();
  host.innerHTML = ents.length? ents.map(d=>`
    <div class="dline">
      <span class="nm">${esc(d.name)}</span>
      <span class="stepper">
        <button data-dec="${d.id}">−</button><span class="num">${d.qty}</span><button data-inc="${d.id}">＋</button>
      </span>
      <span class="lt num">${money(d.price*d.qty)}</span>
    </div>`).join("")
    : `<div class="empty">اضغط على الوجبات لإضافتها</div>`;
  host.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>setQty(b.dataset.inc,S.draft[b.dataset.inc].qty+1));
  host.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>setQty(b.dataset.dec,S.draft[b.dataset.dec].qty-1));
  // عدّاد على كل وجبة وعلى كل تبويب صنف
  document.querySelectorAll("#menuSecs .qbadge").forEach(b=>{
    const q=(S.draft[b.dataset.q]||{}).qty||0;
    b.textContent=q; b.classList.toggle("hide",q===0);
  });
  const counts={};
  ents.forEach(d=>{ const m=DB.menu.find(x=>x.id===d.id); const c=m?itemCat(m):NO_CAT; counts[c]=(counts[c]||0)+d.qty; });
  document.querySelectorAll("#catTabs [data-cb]").forEach(b=>{ const n=counts[b.dataset.cb]||0; b.textContent=n; b.classList.toggle("hide",n===0); });
  updateTotal();
}
function updateTotal(){
  let t=draftItemsTotal();
  const ma=el("manAmt"); if(ma) t+=toInt(ma.value);
  const box=el("ordTotal"); if(box) box.textContent=money(t);
}

async function saveOrder(isAdmin){
  if(S._saving) return;                      // يمنع الإرسال المزدوج بالضغط المكرر
  const pid = isAdmin ? S._forPerson : S.personId;
  if(isAdmin && !pid){ toast("اختر الشخص أول"); return; }
  const date=el("ordDate").value||todayStr();
  const items=draftEntries().map(d=>({name:d.name,price:d.price,qty:d.qty}));
  const manual = isAdmin ? toInt((el("manAmt")||{}).value) : 0;
  const manualNote = isAdmin ? ((el("manNote")||{}).value||"") : "";
  if(items.length===0 && manual===0){ toast("طلبك فارغ"); return; }
  S._saving=true; const btn=el("saveOrder"); if(btn) btn.disabled=true;
  try{
    if(!isAdmin){
      await refreshLocks();
      if(isLocked(date)){ toast("ما تقدر تطلب — "+lockReason(date)); return; }
    }
    const o={ id:uid(), personId:pid, date, items, manual, manualNote,
              note:(el("ordNote")||{}).value||"" };
    o.total=orderTotal(o);
    const ok=await run(()=>apiAddOrder(o)); if(!ok) return;
    o.ts=Date.now(); DB.orders.push(o);
    if(isAdmin) audit("إضافة طلب",pid,`${pname(pid)} · ${dispDate(date)} · ${fmt(o.total)}`);
    toast(isAdmin?"تم إرسال الطلب ✓":"تم إرسال الطلب ✓ — تقدر تعدّله قبل القفل");
    if(isAdmin){ S.draft={};
      if(el("manAmt")) el("manAmt").value=""; if(el("manNote")) el("manNote").value="";
      if(el("ordNote")) el("ordNote").value=""; updateDraftPanel();
    } else {
      S.view="me"; renderApp();
    }
  } finally { S._saving=false; const b2=el("saveOrder"); if(b2) b2.disabled=false; }
}

============================================================ */
let digestDate=null;
function viewToday(){
  hideBar();
  const v=el("view"); const d=digestDate||todayStr();
  const orders=DB.orders.filter(o=>o.date===d);
  // aggregate items
  const agg={}; let itemsCount=0, grand=0;

    grand+=orderTotal(o); });
  const aggArr=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
  const manualLock=DB.locks[d]===true, locked=isLocked(d), autoLock=locked&&!manualLock;

  // restaurant text
  let rtext=`طلبات ${dispDate(d)}:\n`;
  aggArr.forEach(([n,q])=>{ rtext+=`• ${n} × ${q}\n`; });
  rtext+=`——————\nالمجموع: ${itemsCount} وجبة`;

  v.innerHTML=`
   <div class="card card-p" style="margin-bottom:14px">
     <div class="datenav">
       <label class="fld" style="margin:0">اليوم:</label>
       <input class="input" type="date" id="digDate" value="${d}">
       <button class="btn line sm" id="digToday">اليوم</button>
       <button class="btn ${locked?'danger':'line'} sm" id="lockBtn" ${autoLock?"disabled":""}>${manualLock?"مقفل ✓ (اضغط للفتح)":(autoLock?"مقفل تلقائياً":"قفل الطلب")}</button>
     </div>
   </div>

   <div class="grid side">
     <div>
       <div class="card card-p">
         <div class="section-title"><span class="k"></span>الطلبات حسب الشخص (${orders.length})</div>
         ${orders.length? orders.map(o=>`
           <div class="digest-person">
             <h4>${esc(person(o.personId)?.name||"—")}</h4>
             <div class="it">${(o.items||[]).map(i=>esc(i.name)+(i.qty>1?" ×"+i.qty:"")).join("، ")||"—"}${o.manual?` + يدوي ${money(o.manual)}`:""}</div>
             ${o.note?`<div class="it" style="color:var(--gold-deep);margin-top:3px">📝 ${esc(o.note)}</div>`:""}
             <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
               <span class="lt num" style="font-weight:700">${money(orderTotal(o))}</span>
               <button class="btn line sm" data-edito="${o.id}" style="margin-inline-start:auto">تعديل</button>
               <button class="btn danger sm" data-delo="${o.id}">حذف</button>
             </div>
           </div>`).join("") : `<div class="empty">لا توجد طلبات لهذا اليوم</div>`}
       </div>
     </div>
     <div>
       <div class="sumbox">
         <h3>🍽️ ملخّص المطعم</h3>
         ${aggArr.length?`<div class="agg">${aggArr.map(([n,q])=>`<span>${esc(n)} <b class="num">×${q}</b></span>`).join("")}</div>`:`<div style="color:#B9C7BE">لا يوجد</div>`}
         <textarea id="rtext" readonly>${esc(rtext)}</textarea>
         <div class="row" style="margin-top:10px">
           <button class="btn" id="copyR">نسخ لإرساله للمطعم</button>
         </div>
         <div style="display:flex;justify-content:space-between;margin-top:14px;color:#EAF1EC;font-weight:700">
           <span>${itemsCount} وجبة</span><span class="num">${money(grand)}</span>
         </div>
       </div>
     </div>
   </div>`;

  el("digDate").onchange=e=>{ digestDate=e.target.value; viewToday(); };
  el("digToday").onclick=()=>{ digestDate=todayStr(); viewToday(); };
  el("lockBtn").onclick=async()=>{ if(manualLock) delete DB.locks[d]; else DB.locks[d]=true;
    await run(()=>apiSaveSettings()); audit(manualLock?"فتح الطلبات":"قفل الطلبات",null,dispDate(d)); viewToday(); };
  el("copyR").onclick=()=>copyText(rtext);
  bindDeleteOrder();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("تم النسخ ✓")).catch(()=>selectRText());
  } else selectRText();
  function selectRText(){ const ta=el("rtext"); if(ta){ta.focus();ta.select();} toast("حدد النص وانسخه"); }
}
function bindDeleteOrder(){
  document.querySelectorAll("[data-delo]").forEach(b=>b.onclick=()=>deleteOrderAdmin(b.dataset.delo));
  document.querySelectorAll("[data-edito]").forEach(b=>b.onclick=()=>orderEditModal(b.dataset.edito));
}
function deleteOrderAdmin(oid){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  confirmDo(`حذف طلب ${pname(o.personId)} بتاريخ ${dispDate(o.date)} (${money(orderTotal(o))})؟`,async()=>{
    const ok=await run(()=>apiDeleteOrder(oid),"تم الحذف"); if(!ok)return;
    DB.orders=DB.orders.filter(x=>x.id!==oid);
    audit("حذف طلب",o.personId,`${pname(o.personId)} · ${dispDate(o.date)} · ${fmt(orderTotal(o))} · ${(o.items||[]).map(i=>i.name+(i.qty>1?" ×"+i.qty:"")).join("، ")}`);
    renderView();
  });
}

let oeDraft=null;
function orderEditModal(oid,byCustomer){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  oeDraft={ id:o.id, byCustomer:!!byCustomer,
    items:(o.items||[]).map(i=>({name:i.name,price:i.price,qty:i.qty})),

    oeRenderItems(); };
  if(!byCustomer){
    el("oeManual").addEventListener("input",oeUpdateTotal);
    el("oeDel").onclick=()=>deleteOrderAdmin(oid);
  }
  el("oeSave").onclick=oeSave;
}
function oeItemsTotal(){ return oeDraft.items.reduce((s,i)=>s+i.price*i.qty,0); }
function oeUpdateTotal(){ let t=oeItemsTotal(); const m=el("oeManual"); t+=m?toInt(m.value):(oeDraft.manual||0);
  const b=el("oeTotal"); if(b)b.textContent=money(t); }
function oeRenderItems(){
  const host=el("oeItems"); if(!host)return;
  host.innerHTML = oeDraft.items.length? oeDraft.items.map((d,idx)=>`
    <div class="dline"><span class="nm">${esc(d.name)}</span>
      <span class="stepper"><button data-oedec="${idx}">−</button><span class="num">${d.qty}</span><button data-oeinc="${idx}">＋</button></span>
      <span class="lt num">${money(d.price*d.qty)}</span></div>`).join("")
    : `<div class="empty">لا وجبات — أضف من الأسفل</div>`;
  host.querySelectorAll("[data-oeinc]").forEach(b=>b.onclick=()=>{ oeDraft.items[+b.dataset.oeinc].qty++; oeRenderItems(); });
  host.querySelectorAll("[data-oedec]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.oedec;
    oeDraft.items[i].qty--; if(oeDraft.items[i].qty<=0) oeDraft.items.splice(i,1); oeRenderItems(); });
  oeUpdateTotal();
}
async function oeSave(){
  const cust=oeDraft.byCustomer;
  let o=DB.orders.find(x=>x.id===oeDraft.id); if(!o){ closeModal(); return; }
  if(cust){
    await refreshLocks();
    o=await refreshOrder(oeDraft.id);               // آخر نسخة من القاعدة (ربما عدّلتها الإدارة)
    if(!o||o.personId!==S.personId){ toast("الطلب غير موجود"); closeModal(); renderView(); return; }
    if(isLocked(o.date)){ toast("ما تقدر تعدّل — "+lockReason(o.date)); closeModal(); renderView(); return; }
  }else{
    oeDraft.manual=toInt((el("oeManual")||{}).value);
    oeDraft.manualNote=(el("oeManualNote").value||"");
  }
  oeDraft.note=(el("oeNote").value||"");
  const manual=cust?(o.manual||0):oeDraft.manual;
  if(oeDraft.items.length===0 && manual===0){ toast(cust?"الطلب صار فارغ — استخدم زر حذف إذا تريد تلغيه":"الطلب صار فارغ — استخدم زر حذف الطلب"); return; }
  const before=orderTotal(o);
  const upd={...o, items:oeDraft.items.map(i=>({name:i.name,price:i.price,qty:i.qty})),
    manual, manualNote:cust?o.manualNote:oeDraft.manualNote, note:oeDraft.note};
  if(!cust){ upd.personId=el("oePerson").value||o.personId; upd.date=el("oeDate").value||o.date; }
  upd.total=orderTotal(upd);
  const moved=(upd.personId!==o.personId?` · نُقل من ${pname(o.personId)}`:"")+(upd.date!==o.date?` · التاريخ ${dispDate(o.date)} ← ${dispDate(upd.date)}`:"");
  const details=`${pname(upd.personId)} · ${dispDate(upd.date)} · ${fmt(before)} ← ${fmt(upd.total)}${moved}`;
  const ok=await run(()=>apiUpdateOrder(upd),"تم حفظ التعديل ✓"); if(!ok) return;
  Object.assign(o,upd);
  if(!DB.orders.includes(o)){ const i=DB.orders.findIndex(x=>x.id===o.id); if(i>=0) DB.orders[i]=o; }
  audit(cust?"تعديل طلب (من الموظف)":"تعديل طلب",upd.personId,details,cust?pname(upd.personId):undefined);
  closeModal(); renderView();
}

/* ---------- دفعة: إضافة / تعديل / حذف ---------- */
function paymentModal(pid,editId){
  const p=person(pid); const bal=balance(pid);
  const ex=editId?DB.payments.find(x=>x.id===editId):null;
  openModal((ex?"تعديل دفعة — ":"تسجيل دفعة — ")+p.name,
   `<div class="stack">
     <div class="card card-p" style="box-shadow:none;background:var(--paper)">
       <span class="muted" style="font-size:13px">${bal<0?"رصيد له حالياً":"المتبقي حالياً"}</span>
       <div class="num ${bal>0?'owed':'clear'}" style="font-size:22px;font-weight:800;font-family:Cairo">${money(Math.abs(bal))}</div>
     </div>
     <div><label class="fld">المبلغ المدفوع</label><input class="input num" id="payAmt" inputmode="numeric" placeholder="0" value="${ex?ex.amount:""}"></div>
     <div id="payHint" class="muted" style="font-size:12px;margin-top:-6px"></div>
     ${ex?"":`<div class="row"><button class="btn line sm" id="payFull" type="button">دفع الكل (${fmt(Math.max(0,bal))})</button></div>`}
     <div><label class="fld">التاريخ</label><input class="input" type="date" id="payDate" value="${ex?ex.date:todayStr()}"></div>
     <div><label class="fld">ملاحظة (اختياري)</label><input class="input" id="payNote" value="${ex?esc(ex.note):""}"></div>
     <button class="btn block" id="paySave">${ex?"حفظ التعديل":"حفظ الدفعة"}</button>
     ${ex?`<button class="btn danger block" id="payDel" type="button">حذف الدفعة</button>`:""}
   </div>`);
  const hint=()=>{ const a=toInt(el("payAmt").value); const after=bal-(ex?-0:0)-(ex?0:a)+(ex?ex.amount-a:0);
    el("payHint").textContent = a>0 ? (after<0?`⚠️ المبلغ أكبر من المتبقي — يصير له رصيد ${fmt(-after)}`:`الباقي بعد الدفعة: ${fmt(after)}`) : ""; };
  el("payAmt").addEventListener("input",hint); hint();
  if(!ex) el("payFull").onclick=()=>{ el("payAmt").value=Math.max(0,bal); hint(); };
  el("paySave").onclick=async()=>{
    const amt=toInt(el("payAmt").value);
    if(amt<=0){ toast("أدخل مبلغ صحيح أكبر من صفر"); return; }
    const date=el("payDate").value||todayStr(), note=el("payNote").value||"";
    if(ex){
      const upd={...ex,amount:amt,date,note};
      const ok=await run(()=>apiUpdatePayment(upd),"تم حفظ التعديل ✓"); if(!ok)return;
      audit("تعديل دفعة",pid,`${p.name} · ${fmt(ex.amount)} ← ${fmt(amt)} · ${dispDate(ex.date)}${ex.date!==date?" ← "+dispDate(date):""}${note?" · "+note:""}`);
      Object.assign(ex,upd);
    }else{
      const np={id:uid(),personId:pid,amount:amt,date,note,ts:Date.now()};
      const ok=await run(()=>apiAddPayment(np),"تم تسجيل الدفعة ✓"); if(!ok)return;
      DB.payments.push(np);
      audit("تسجيل دفعة",pid,`${p.name} · ${fmt(amt)} · ${dispDate(date)}${note?" · "+note:""}`);
    }
    closeModal(); renderView();
  };
  if(ex) el("payDel").onclick=()=>confirmDo(`حذف دفعة ${money(ex.amount)} (${dispDate(ex.date)})؟ الرصيد يرجع كما كان قبلها.`,async()=>{
    const ok=await run(()=>apiDeletePayment(ex.id),"تم حذف الدفعة"); if(!ok)return;
    DB.payments=DB.payments.filter(x=>x.id!==ex.id);
    audit("حذف دفعة",pid,`${p.name} · ${fmt(ex.amount)} · ${dispDate(ex.date)}${ex.note?" · "+ex.note:""}`);
    renderView();
  });
}

/* ---------- تسوية: خصم أو إضافة على الحساب ---------- */
function adjModal(pid,editId){
  if(!DB.schemaOk){ toast("شغّل أمر ترقية قاعدة البيانات أولاً (التنبيه الأصفر أعلى الصفحة)"); return; }
  const p=person(pid); const ex=editId?DB.adjustments.find(x=>x.id===editId):null;
  let disc=ex?ex.amount<0:true;
  openModal((ex?"تعديل تسوية — ":"خصم / إضافة — ")+p.name,
   `<div class="stack">
     <div class="seg"><button type="button" id="adKD" class="${disc?"on":""}">خصم (ينقص من حسابه)</button><button type="button" id="adKC" class="${disc?"":"on"}">إضافة (تزيد عليه)</button></div>
     <div><label class="fld">المبلغ</label><input class="input num" id="adAmt" inputmode="numeric" placeholder="0" value="${ex?Math.abs(ex.amount):""}"></div>
     <div><label class="fld">التاريخ</label><input class="input" type="date" id="adDate" value="${ex?ex.date:todayStr()}"></div>
     <div><label class="fld">السبب (يظهر بالكشف والسجل)</label><input class="input" id="adNote" value="${ex?esc(ex.note):""}" placeholder="مثال: خصم عن طلب اليوم / تصحيح خطأ"></div>
     <button class="btn block" id="adSave">${ex?"حفظ التعديل":"حفظ"}</button>
     ${ex?`<button class="btn danger block" id="adDel" type="button">حذف التسوية</button>`:""}
   </div>`);
  const sync=()=>{ el("adKD").classList.toggle("on",disc); el("adKC").classList.toggle("on",!disc); };
  el("adKD").onclick=()=>{disc=true;sync();}; el("adKC").onclick=()=>{disc=false;sync();};
  el("adSave").onclick=async()=>{
    const a=Math.abs(toInt(el("adAmt").value));
    if(a<=0){ toast("أدخل مبلغ صحيح"); return; }
    const amount=disc?-a:a, date=el("adDate").value||todayStr(), note=(el("adNote").value||"").trim();
    const kind=disc?"خصم":"إضافة";
    if(ex){
      const upd={...ex,amount,date,note};
      const ok=await run(()=>apiUpdateAdj(upd),"تم حفظ التعديل ✓"); if(!ok)return;
      audit("تعديل تسوية",pid,`${p.name} · ${fmt(ex.amount)} ← ${fmt(amount)} · ${dispDate(date)}${note?" · "+note:""}`);
      Object.assign(ex,upd);
    }else{
      const na={id:uid(),personId:pid,amount,date,note,ts:Date.now()};
      const ok=await run(()=>apiAddAdj(na),"تم ✓"); if(!ok)return;
      DB.adjustments.push(na);
      audit("تسوية "+kind,pid,`${p.name} · ${kind} ${fmt(a)} · ${dispDate(date)}${note?" · "+note:""}`);
    }
    closeModal(); renderView();
  };
  if(ex) el("adDel").onclick=()=>confirmDo(`حذف ${ex.amount<0?"الخصم":"الإضافة"} ${money(Math.abs(ex.amount))}؟`,async()=>{
    const ok=await run(()=>apiDeleteAdj(ex.id),"تم الحذف"); if(!ok)return;
    DB.adjustments=DB.adjustments.filter(x=>x.id!==ex.id);
    audit("حذف تسوية",pid,`${p.name} · ${fmt(ex.amount)} · ${dispDate(ex.date)}${ex.note?" · "+ex.note:""}`);
    renderView();
  });
}

/* ---------- الطباعة ---------- */
function personReceipt(p,from,to){
  const st=statement(p.id,from,to);
  const body=(st.prev?`<tr><td></td><td>رصيد سابق</td><td class="num">${fmt(st.prev)}</td><td class="num">${fmt(st.prev)}</td></tr>`:"")
    +st.entries.map(e=>`<tr><td>${dispDate(e.date)}</td><td>${entryLabel(e)}</td><td class="num">${e.amount<0?"−":"+"}${fmt(Math.abs(e.amount))}</td><td class="num">${fmt(e.run)}</td></tr>`).join("");
  return `<div class="receipt">
    <div class="r-head"><div class="r-b">سفرة</div><div class="r-meta">كشف حساب — ${esc(p.name)}</div>
      <div class="r-meta">${periodTitle(from,to)}</div></div>
    <table><thead><tr><th>التاريخ</th><th>التفاصيل</th><th class="num">المبلغ</th><th class="num">الرصيد</th></tr></thead><tbody>
      ${body||`<tr><td colspan="4" style="text-align:center;color:#888">لا حركات بهذه الفترة</td></tr>`}
    </tbody></table>
    <div class="r-tot">
      <div class="line"><span>رصيد سابق</span><span class="num">${fmt(st.prev)}</span></div>
      <div class="line"><span>طلبات الفترة</span><span class="num">${fmt(st.orders)}</span></div>
      ${st.adj?`<div class="line"><span>تسويات (خصم/إضافة)</span><span class="num">${fmt(st.adj)}</span></div>`:""}
      <div class="line"><span>المدفوع</span><span class="num">${fmt(st.pay)}</span></div>
      <div class="line big"><span>${st.closing<0?"رصيد له":"المتبقي عليه"}</span><span class="num">${money(Math.abs(st.closing))}</span></div>
    </div>
    <div class="r-foot">شكراً — سفرة</div></div>`;
}
function printReport(){
  const {pid,from,to,rows}=reportData();
  let html;
  if(pid!=="__all") html=personReceipt(rows[0].p,from,to);
  else{
    const gClose=rows.reduce((s,r)=>s+r.st.closing,0);
    html=`<div class="receipt">
      <div class="r-head"><div class="r-b">سفرة</div><div class="r-meta">كشف حساب عام</div>
        <div class="r-meta">${periodTitle(from,to)}</div></div>
      <table><thead><tr><th>الشخص</th><th class="num">طلبات</th><th class="num">مدفوع</th><th class="num">الرصيد</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td class="num">${fmt(r.st.orders+r.st.adj)}</td><td class="num">${fmt(r.st.pay)}</td><td class="num">${fmt(r.st.closing)}</td></tr>`).join("")}
      </tbody></table>
      <div class="r-tot"><div class="line big"><span>مجموع الأرصدة</span><span class="num">${money(gClose)}</span></div></div>
      <div class="r-foot">سفرة</div></div>`;
  }
  el("printRoot").innerHTML=html; window.print();
}
function printEachReport(){
  const from=el("rpFrom").value, to=el("rpTo").value;
  const people=DB.people.filter(p=>{ const s=statement(p.id,from,to); return s.prev||s.entries.length; });
  if(!people.length){ toast("لا توجد حركات بهذه الفترة"); return; }
  el("printRoot").innerHTML=people.map(p=>personReceipt(p,from,to)).join(""); window.print();
}

function viewPeople(){
  hideBar();
  const v=el("view");
  v.innerHTML=`
   <div class="card card-p" style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
     <div class="section-title" style="margin:0;flex:1"><span class="k"></span>الأشخاص (${DB.people.length})</div>
     <button class="btn sm" id="addP">＋ شخص</button>
   </div>
   <div class="plist">${DB.people.map(p=>`
     <div class="prow">
       <div class="av">${esc(initials(p.name))}</div>
       <div style="flex:1;min-width:0"><div class="nm">${esc(p.name)}</div>
         <div class="sub">${p.pin?"🔒 له رمز":"بدون رمز"} · ${personOrders(p.id).length} طلب${p.opening?" · رصيد سابق "+fmt(p.opening):""}</div></div>
       <button class="btn line sm" data-editp="${p.id}">تعديل</button>
       <button class="btn danger sm" data-delp="${p.id}">حذف</button>
     </div>`).join("")}</div>`;
  el("addP").onclick=()=>personModal();
  document.querySelectorAll("[data-editp]").forEach(b=>b.onclick=()=>personModal(b.dataset.editp));
  document.querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>{
    const p=person(b.dataset.delp);
    const n1=personOrders(p.id).length, n2=personPayments(p.id).length, bal=balance(p.id);
    const has=n1||n2||p.opening;
    const doDelete=async()=>{
      const ok=await run(async()=>{
        // نحذف حركات الشخص صراحة (لا نعتمد على cascade) ثم الشخص
        const a=await sb.from('orders').delete().eq('person_id',p.id); if(a.error)throw a.error;
        const b2=await sb.from('payments').delete().eq('person_id',p.id); if(b2.error)throw b2.error;
        if(DB.schemaOk){ const c=await sb.from('adjustments').delete().eq('person_id',p.id); if(c.error)throw c.error; }
        await apiDeletePerson(p.id);
      },"تم الحذف"); if(!ok)return;
      DB.people=DB.people.filter(x=>x.id!==p.id);
      DB.orders=DB.orders.filter(o=>o.personId!==p.id);
      DB.payments=DB.payments.filter(x=>x.personId!==p.id);
      DB.adjustments=(DB.adjustments||[]).filter(x=>x.personId!==p.id);
      audit("حذف شخص",null,`${p.name} · ${n1} طلب · ${n2} دفعة · رصيده وقت الحذف ${fmt(bal)}`);
      viewPeople();
    };
    if(has) confirmType(`«${p.name}» عنده ${n1} طلب و${n2} دفعة (رصيده ${money(bal)}). الحذف يمسح كل حركاته نهائياً.`,p.name,doDelete);
    else confirmDo(`حذف «${p.name}»؟`,doDelete);
  });
}

     <div><label class="fld">رصيد سابق (قبل استخدام النظام)</label><input class="input num" id="pOpen" inputmode="numeric" value="${p&&p.opening?p.opening:""}" placeholder="0">
       <div class="muted" style="font-size:12px;margin-top:6px">${DB.schemaOk?"موجب = عليه · سالب = له. يدخل بحسابه وكشفه.":"⚠️ يحتاج تشغيل أمر الترقية أولاً"}</div></div>
     <button class="btn block" id="pSave">${p?"حفظ":"إضافة"}</button>
   </div>`);
  el("pSave").onclick=async()=>{
    const name=(el("pName").value||"").trim(); const pin=(el("pPin").value||"").trim();
    const opening=DB.schemaOk?toInt(el("pOpen").value):(p?p.opening||0:0);
    if(!name){ toast("اكتب الاسم"); return; }
    if(DB.people.some(x=>x.name===name && (!p||x.id!==p.id))){ toast("يوجد شخص بنفس الاسم"); return; }
    if(p){ const upd={...p,name,pin,opening}; const ok=await run(()=>apiUpdatePerson(upd),"تم ✓"); if(!ok)return;
      const ch=[]; if(p.name!==name)ch.push(`الاسم: ${p.name} ← ${name}`); if(p.pin!==pin)ch.push("تغيير الرمز"); if((p.opening||0)!==opening)ch.push(`رصيد سابق: ${fmt(p.opening||0)} ← ${fmt(opening)}`);
      if(ch.length) audit("تعديل شخص",p.id,name+" · "+ch.join(" · "));
      Object.assign(p,upd); }
    else{ const np={id:uid(),name,pin,opening}; const ok=await run(()=>apiAddPerson(np),"تم ✓"); if(!ok)return; DB.people.push(np);
      audit("إضافة شخص",np.id,name+(opening?" · رصيد سابق "+fmt(opening):"")); }
    closeModal();
    if(S.view==="order") viewOrder(true); else renderView();
  };
}
